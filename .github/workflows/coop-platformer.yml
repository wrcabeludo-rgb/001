name: Coop Platformer build

on:
  push:
    paths:
      - "coop-platformer/game/**"
      - ".github/workflows/coop-platformer.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coop-platformer
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and Windows export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tmp="$RUNNER_TEMP/godot"
          mkdir -p "$tmp"
          wget -q -O "$tmp/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q -O "$tmp/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$tmp/godot.zip" -d "$tmp"
          sudo mv "$tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j "$tmp/templates.tpz" "templates/windows_*" "templates/version.txt" -d "$templates"
          ls "$templates"
          rm -rf "$tmp"

      - name: Import project
        run: godot --headless --path game --import

      - name: Smoke test (run the game for 5 seconds)
        run: |
          godot --headless --path game --quit-after 300 2>&1 | tee run.log
          godot --headless --path game res://scenes/test_room.tscn --quit-after 300 2>&1 | tee -a run.log
          godot --headless --path game res://scenes/coop_level.tscn --quit-after 300 2>&1 | tee -a run.log
          if grep -E "SCRIPT ERROR|ERROR:" run.log; then
            echo "::error::The game printed errors while running"
            exit 1
          fi

      - name: Movement tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/movement_test.tscn 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" test.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Combat tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/combat_test.tscn 2>&1 | tee combat.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" combat.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Co-op tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/coop_test.tscn 2>&1 | tee coop.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" coop.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Enemy tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/enemy_test.tscn 2>&1 | tee enemy.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" enemy.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path game --export-release "Windows" ../build/windows/CoopPlatformer.exe 2>&1 | tee export.log
          test -f build/windows/CoopPlatformer.exe
          ls -la build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: CoopPlatformer-windows
          path: coop-platformer/build/windows/
          if-no-files-found: error
