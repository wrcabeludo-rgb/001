name: Coop Platformer build

on:
  push:
    paths:
      - "coop-platformer/game/**"
      - ".github/workflows/coop-platformer.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coop-platformer
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and Windows export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tmp="$RUNNER_TEMP/godot"
          mkdir -p "$tmp"
          wget -q -O "$tmp/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q -O "$tmp/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$tmp/godot.zip" -d "$tmp"
          sudo mv "$tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j "$tmp/templates.tpz" "templates/windows_*" "templates/version.txt" -d "$templates"
          ls "$templates"
          rm -rf "$tmp"

      - name: Import project
        run: godot --headless --path game --import

      - name: Smoke test (run the game for 5 seconds)
        run: |
          godot --headless --path game --quit-after 300 2>&1 | tee run.log
          godot --headless --path game res://scenes/test_room.tscn --quit-after 300 2>&1 | tee -a run.log
          godot --headless --path game res://scenes/coop_level.tscn --quit-after 300 2>&1 | tee -a run.log
          godot --headless --path game res://scenes/mechanics_level.tscn --quit-after 300 2>&1 | tee -a run.log
          godot --headless --path game res://scenes/intro_comic.tscn --quit-after 300 2>&1 | tee -a run.log
          for scene in slums_level metro_level drain_level assembly_level shop world1_ending hero_select gamepad_check; do
            godot --headless --path game res://scenes/$scene.tscn --quit-after 300 2>&1 | tee -a run.log
          done
          if grep -E "SCRIPT ERROR|ERROR:" run.log; then
            echo "::error::The game printed errors while running"
            exit 1
          fi

      - name: Movement tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/movement_test.tscn 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" test.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Combat tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/combat_test.tscn 2>&1 | tee combat.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" combat.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Co-op tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/coop_test.tscn 2>&1 | tee coop.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" coop.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Enemy tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/enemy_test.tscn 2>&1 | tee enemy.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" enemy.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Level mechanics tests
        run: |
          set +e
          timeout 180 godot --headless --path game res://tests/mechanics_test.tscn 2>&1 | tee mechanics.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" mechanics.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Meta game tests (saves, shop, weapons, power-ups, secrets, pause)
        run: |
          set +e
          timeout 300 godot --headless --path game res://tests/meta_test.tscn 2>&1 | tee meta.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" meta.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: World 1 boss tests (difficulty, boss, zone exit)
        run: |
          set +e
          timeout 300 godot --headless --path game res://tests/boss_test.tscn 2>&1 | tee boss.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR" boss.log; then
            echo "::error::Script errors during tests"
            exit 1
          fi
          exit $status

      - name: Install rcedit (puts the game icon into the exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 > /dev/null
          wine_bin=$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)
          wget -q -O "$RUNNER_TEMP/rcedit.exe" https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          WINEDEBUG=-all "$wine_bin" wineboot --init > /dev/null 2>&1 || true
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/windows/rcedit = "%s"\nexport/windows/wine = "%s"\n' \
            "$RUNNER_TEMP/rcedit.exe" "$wine_bin" > "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path game --export-release "Windows" ../build/windows/CoopPlatformer.exe 2>&1 | tee export.log
          test -f build/windows/CoopPlatformer.exe
          ls -la build/windows
          echo "--- export warnings ---"
          grep -iE "warning|error|rcedit" export.log | grep -v "savepack" || true

      - name: Check the exe icon
        run: |
          pip install --quiet pefile
          python3 - <<'PY'
          import pefile
          exe = pefile.PE("build/windows/CoopPlatformer.exe")
          sizes = []
          for entry in exe.DIRECTORY_ENTRY_RESOURCE.entries:
              if entry.id == 3:  # RT_ICON
                  for icon in entry.directory.entries:
                      for lang in icon.directory.entries:
                          sizes.append(lang.data.struct.Size)
          print("icon images in the exe:", len(sizes), "bytes:", sizes)
          # Godot's own icon has a 67624-byte 128x128 image; ours has none that size.
          assert 67624 not in sizes, "the exe still has the default Godot icon"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CoopPlatformer-windows
          path: coop-platformer/build/windows/
          if-no-files-found: error
